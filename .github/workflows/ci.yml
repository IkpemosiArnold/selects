# Tests and builds on every push and pull request. No models, whisper or Ollama are needed:
# every expensive stage is a fake in the tests. Two things are: ffmpeg (two eval tests
# generate a short tone with it) and the browser engine's packages (src/browser tests import
# mediabunny, and the review app's build bundles the engine).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/browser/package-lock.json
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm ci
      - run: npm --prefix src/browser ci
      - run: npm test

  build:
    name: build (review app and Selects Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            src/browser/package-lock.json
      # the local review app, served by `selects serve` (web/dist); it bundles src/browser too
      - name: Build the review app
        run: npm --prefix src/browser ci && cd web && npm ci && npm run build
      # the hosted Selects Web, exactly as Render builds it (render.yaml buildCommand)
      - name: Build Selects Web (Render's build command)
        run: npm --prefix src/browser ci && npm --prefix web ci && npm --prefix web run build:web
      - name: Check the hosted build
        run: test -f dist-web/index.html && test -f dist-web/manifest.webmanifest
