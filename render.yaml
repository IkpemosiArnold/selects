# Render Blueprint for Selects Web. Not deployed yet: Arnold connects the repo in Render.
# The site is the React review app in web/, built with VITE_ENGINE=browser so the whole
# pipeline runs in the visitor's tab (src/browser). It writes dist-web/.
#
# 1. selects-web: the static site. The browser does all the work (whisper, Gemma, the
#    render), so the host only serves files. Multithreaded WebAssembly needs the two
#    cross-origin isolation headers below. COEP is "require-corp", not "credentialless":
#    Safari (iOS and macOS, through 27.2) does not support "credentialless" and treats it
#    as no policy, so iPhones were never isolated and ran whisper on one thread. Every
#    cross-origin request the page makes is a CORS fetch (Hugging Face, the Gemini API, the
#    proxy), which "require-corp" allows, and all code and WebAssembly is served from here.
# 2. selects-smart-proxy: a free Node web service for Smart mode. It holds the Gemini API
#    key (GEMINI_API_KEY, set in the dashboard, never in git), accepts only Selects judge
#    tasks (clip text, size-limited), refuses junk with a per-IP ingress limit before reading
#    it, charges the model quota (per IP and global) only for valid tasks, and does not log
#    clip text. The policy is in README.md, "The Smart mode proxy: limits".
#    Free web services sleep after 15 minutes idle and take up to about a minute to wake;
#    the page shows a "waking" note while it waits.
services:
  - type: web
    name: selects-web
    runtime: static
    # the review app (web/) built on the in-browser engine (src/browser); see web/vite.config.js
    buildCommand: npm --prefix src/browser ci && npm --prefix web ci && npm --prefix web run build:web
    staticPublishPath: ./dist-web
    envVars:
      # the proxy's public URL, baked into the page at build time
      # (for example https://selects-smart-proxy.onrender.com)
      - key: VITE_SELECTS_PROXY_URL
        sync: false
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: selects-smart-proxy
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server-proxy/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # the Gemma models the Gemini API serves (16 Oct 2026): the 26B MoE answered judge
      # calls in about 2 s, the 31B dense model in up to a minute
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_FALLBACKS
        value: gemma-4-31b-it
      - key: GEMMA_TIMEOUT_MS
        value: "25000"
      # the static site's URL, for example https://selects-web.onrender.com (no wildcard)
      - key: ALLOWED_ORIGINS
        sync: false
      # Measured on the live service (21 Oct 2026): Render sits behind Cloudflare, so
      # X-Forwarded-For ends "client, cloudflare-edge, render-internal". With 3 trusted hops the
      # proxy keys its rate limit on the real client and ignores anything the client prepends.
      # Check after any change: curl -H 'X-Forwarded-For: 1.2.3.4' <proxy>/healthz must show your
      # own public address in "you".
      - key: TRUST_PROXY_HOPS
        value: "3"
