<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23F2BE22%22/%3E%3C/svg%3E">
<title>Selects Web test page</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1d2126">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root { color-scheme: light dark; --bg: #fafaf7; --fg: #1b1b1b; --muted: #666; --line: #ddd; --accent: #F2BE22; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #eee; --muted: #aaa; --line: #333; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0; } h2 { font-size: 16px; margin: 20px 0 6px; }
  .muted { color: var(--muted); } .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  input[type=text], input[type=password], select { padding: 4px 6px; max-width: 100%; }
  button { padding: 6px 12px; cursor: pointer; }
  pre#log { background: rgba(127,127,127,.1); padding: 8px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; } td, th { border-top: 1px solid var(--line); padding: 4px 6px; vertical-align: top; text-align: left; }
  video { width: 220px; aspect-ratio: 9/16; background: #000; }
  .bar { height: 6px; background: var(--line); } .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
</style>
</head>
<body>
<main>
  <h1>Selects Web, engine test page</h1>
  <p class="muted" id="tagline"></p>
  <div class="row">
    <input type="file" id="file" accept="video/*">
    <label>Mode <select id="mode"><option value="private">Private</option><option value="smart">Smart</option></select></label>
    <label>Judge <select id="prefer"><option value="auto">auto</option><option value="gemma3-wasm">Gemma 3 1B (CPU)</option><option value="gemma4-webgpu">Gemma 4 E2B (WebGPU)</option></select></label>
    <label>judgeN <input type="text" id="judgeN" value="8" size="2"></label>
  </div>
  <div class="row" id="smartRow" hidden>
    <input type="password" id="key" placeholder="Gemini API key (optional)" size="28">
    <input type="text" id="proxy" placeholder="Proxy URL (optional)" size="30">
    <input type="text" id="smartModel" placeholder="gemma-4-31b-it" size="16">
  </div>
  <p class="muted" id="modeLine"></p>
  <div class="row"><button id="start">Find clips</button><span id="stage"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <h2>Saved on this device</h2><div id="saved"></div>
  <div class="row"><button id="notify">Notify me when clips are ready</button></div>
  <h2>This browser</h2><pre id="caps" class="muted"></pre>
  <h2>Clips</h2><table id="cands"></table>
  <div class="row"><button id="render" disabled>Render approved</button><label><select id="preset"><option>shorts</option><option>preview</option></select></label></div>
  <div class="row" id="out"></div>
  <h2>Log</h2><pre id="log"></pre>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
